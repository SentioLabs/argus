name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Extract version
        id: version
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          TAG: ${{ steps.release.outputs.tag_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            build_stoolap: false
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            build_stoolap: true
          - runner: macos-latest
            goos: darwin
            goarch: arm64
            build_stoolap: false
    runs-on: ${{ matrix.runner }}
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Rust toolchain
        if: matrix.build_stoolap
        uses: dtolnay/rust-toolchain@stable

      - name: Build stoolap native library
        if: matrix.build_stoolap
        run: |
          STOOLAP_VERSION=$(grep 'stoolap/stoolap-go ' go.mod | awk '{print $2}')
          git clone --depth 1 --branch "${STOOLAP_VERSION}" https://github.com/stoolap/stoolap.git /tmp/stoolap
          cd /tmp/stoolap
          cargo build --release --features semantic
          echo "STOOLAP_LIB=$(pwd)/target/release" >> "$GITHUB_ENV"

      - name: Verify modules
        run: go mod verify

      - name: Build
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          go build -ldflags "-s -w \
            -X github.com/sentiolabs/argus/cmd.Version=${VERSION} \
            -X github.com/sentiolabs/argus/cmd.Commit=${COMMIT} \
            -X github.com/sentiolabs/argus/cmd.BuildDate=${BUILD_DATE}" \
            -o argus .
          tar czf "argus_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz" argus

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: argus-${{ matrix.goos }}-${{ matrix.goarch }}
          path: argus_*.tar.gz

  release:
    needs: [release-please, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum argus_*.tar.gz > checksums.txt

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY"

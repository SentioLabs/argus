name: Pre-release

on:
  push:
    tags:
      - 'v*-rc*'
      - 'v*-beta*'
      - 'v*-alpha*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            build_stoolap: false
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            build_stoolap: true
          - runner: macos-latest
            goos: darwin
            goarch: arm64
            build_stoolap: false
    runs-on: ${{ matrix.runner }}
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Rust toolchain
        if: matrix.build_stoolap
        uses: dtolnay/rust-toolchain@stable

      - name: Build stoolap native library
        if: matrix.build_stoolap
        run: |
          STOOLAP_VERSION=$(grep 'stoolap/stoolap-go ' go.mod | awk '{print $2}')
          git clone --depth 1 --branch "${STOOLAP_VERSION}" https://github.com/stoolap/stoolap.git /tmp/stoolap
          cd /tmp/stoolap
          cargo build --release --features semantic
          sudo cp target/release/libstoolap.so /usr/local/lib/
          sudo ldconfig

      - name: Verify modules
        run: go mod verify

      - name: Build
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          go build -ldflags "-s -w \
            -X github.com/sentiolabs/argus/cmd.Version=${VERSION} \
            -X github.com/sentiolabs/argus/cmd.Commit=${COMMIT} \
            -X github.com/sentiolabs/argus/cmd.BuildDate=${BUILD_DATE}" \
            -o argus .
          tar czf "argus_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz" argus

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: argus-${{ matrix.goos }}-${{ matrix.goarch }}
          path: argus_*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum argus_*.tar.gz > checksums.txt

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --prerelease \
            --generate-notes

version: '3'

vars:
  BIN_DIR: ./bin
  CLI_BIN: '{{.BIN_DIR}}/argus'
  GO: go
  MODULE: github.com/sentiolabs/argus
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo none
  BUILD_DATE:
    sh: date -u '+%Y-%m-%dT%H:%M:%SZ'
  LDFLAGS: >-
    -s -w
    -X {{.MODULE}}/cmd.Version={{.VERSION}}
    -X {{.MODULE}}/cmd.Commit={{.COMMIT}}
    -X {{.MODULE}}/cmd.BuildDate={{.BUILD_DATE}}

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list
    silent: true

  build:
    desc: Build the argus binary into ./bin
    sources:
      - '**/*.go'
      - go.mod
      - go.sum
    generates:
      - '{{.CLI_BIN}}'
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - '{{.GO}} build -ldflags="{{.LDFLAGS}}" -o {{.CLI_BIN}} .'

  run:
    desc: Build and run argus sync in dry-run mode
    cmds:
      - task: build
      - '{{.CLI_BIN}} sync --dry-run'

  test:
    desc: Run unit tests with race detection and coverage
    cmds:
      - '{{.GO}} test -race -cover ./...'

  test:verbose:
    desc: Run unit tests with verbose output
    cmds:
      - '{{.GO}} test -race -cover -v ./...'

  test:coverage:
    desc: Run unit tests and write an HTML coverage report
    cmds:
      - '{{.GO}} test -race -coverprofile=coverage.out ./...'
      - '{{.GO}} tool cover -html=coverage.out -o coverage.html'
      - 'echo "Coverage report: coverage.html"'

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run

  lint:fix:
    desc: Run golangci-lint with auto-fix
    cmds:
      - golangci-lint run --fix

  fmt:
    desc: Format Go sources
    cmds:
      - '{{.GO}} fmt ./...'

  release:snapshot:
    desc: Build a release snapshot locally with goreleaser (no tag required)
    cmds:
      - goreleaser release --snapshot --clean

  check:versions:
    desc: Assert mise.toml and go.mod agree on the Go version
    cmds:
      - cmd: |
          mise_go="$(grep -E '^go[[:space:]]*=' mise.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')"
          mod_go="$(grep -E '^go ' go.mod | head -1 | awk '{print $2}')"
          if [ -z "$mise_go" ] || [ -z "$mod_go" ]; then
            echo "ERROR: could not read Go version (mise.toml='$mise_go' go.mod='$mod_go')" >&2
            exit 1
          fi
          if [ "$mise_go" != "$mod_go" ]; then
            echo "ERROR: Go version mismatch: mise.toml=$mise_go, go.mod=$mod_go" >&2
            echo "Update mise.toml to match go.mod." >&2
            exit 1
          fi
          echo "Go version aligned: $mod_go"

  verify:
    desc: Build, then validate the argus config
    cmds:
      - task: build
      - '{{.CLI_BIN}} config validate'

  version:
    desc: Build, then print version information
    cmds:
      - task: build
      - '{{.CLI_BIN}} version'

  clean:
    desc: Remove build artifacts and coverage reports
    cmds:
      - rm -rf {{.BIN_DIR}} dist
      - rm -f coverage.out coverage.html

  ci:
    desc: Run the local CI pipeline (version guard, tests, lint)
    cmds:
      - task: check:versions
      - task: test
      - task: lint
